<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Dream House</title>

<script src="SCRIPT/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>

<script>
    function teleportToBalcony() {
        var camera = document.querySelector('a-camera');
        camera.setAttribute('position', '-35 8 -8');
        camera.setAttribute('rotation', '0 90 0');
    }
</script>

</head>

<body style="background: #87CEEB;">

    <a-scene renderer="antialias: true; colorManagement: true;" shadow="type: basic" fog="type: linear; color: #ced4da; near: 150; far: 300">

        <!--Assets Management System-->

        <a-assets timeout="30000">

            <img src="texture/Grass_10_baseColor.jpeg" id="grass">

            <img src="texture/Grass_10_specularf0.png" id="rgb">

            <img src="texture/Pavers_with_Grass_Herringbone_baseColor.jpeg" id="pavement">

            <img src="texture/Grass_10_baseColor.jpeg" id="tile">

            <!-- glTF Models from respective folders -->
            <a-asset-item src="model/modern/scene.gltf" id="mm"></a-asset-item>

            <a-asset-item src="model/good/scene.gltf" id="good"></a-asset-item>

            <a-asset-item src="model/iron_gate/scene.gltf" id="gate"></a-asset-item>
            <a-asset-item src="model/2021_lamborghini_countach_lpi_800-4/scene.gltf" id="lamborghini"></a-asset-item>
            <a-asset-item src="model/balcony/scene.gltf" id="balcony"></a-asset-item>
            <a-asset-item src="model/stylized_tree/scene.gltf" id="tree"></a-asset-item>

        </a-assets>



        <!-- Matching Sky-Fog Color for Infinite World -->
        <a-sky id="sky-dome" material="shader: gradient; topColor: #1e3c72; bottomColor: #ced4da; offset: 0.5"></a-sky>

        <!-- Animated Swimming Pool with Water Waves -->
        <a-plane id="water-pool-front" position="-15 4 -15" rotation="-90 0 0" width="8" height="12" 
                 material="color: #4A90E2; transparent: true; opacity: 0.8; repeat: 4 6"
                 animation="property: material.offset; to: 0 1; dur: 3000; dir: alternate; loop: true"></a-plane>


        <!-- Enhanced Ground with Shadow Reception -->
        <a-plane id="ground-plane" position="0 3 0" rotation="-90 0 0" width="1000" height="1000" 
                 material="src:#grass; normal-map: #rgb; normal-texture-repeat: 800 800; repeat: 800 800; roughness: 0.9; metalness: 0.1"
                 shadow="receive: true"></a-plane>
        
        <!-- Wide Stone Pathway from Gate to Villa Entrance -->
        <a-plane id="main-pathway" position="0 3.1 35" rotation="-90 0 0" width="8" height="70" 
                 material="src:#pavement; repeat: 8 14; roughness: 0.9"></a-plane>
        
        <!-- Stone Pathway to Car -->
        <a-plane id="car-pathway" position="25 3.05 15" rotation="-90 0 90" width="4" height="30" 
                 material="src:#pavement; repeat: 6 6; roughness: 0.9"></a-plane>

        <!-- Compound -->
        <a-plane id="compound-area" scale="80 60 1" repeat="50 50" position="20 3.1 -10" rotation="-90 0 0" material="src:#pavement; roughness: 0.9"></a-plane>

        <!--Interactive Iron Gate with Click Animation -->
        <a-entity gltf-model="#gate" id="gate-entity" position="0 4.3 50" scale="0.8 0.8 0.8" 
                 shadow="cast: true; receive: true"
                 animation__open="property: rotation; to: 0 0 0; dur: 2000; startEvents: click; easing: easeInOutQuad"></a-entity>
        
        <!-- Complete Perimeter Wall - Property Enclosure -->
        <!-- Left border -->
        <a-box id="fence-left" position="-50 1 0" src="#pavement" repeat="20 6" width="0.2" height="10" depth="100" 
               material="roughness: 0.8; metalness: 0.1" shadow="cast: true; receive: true"></a-box>
        
        <!-- Right border -->
        <a-box id="fence-right" position="50 1 0" src="#pavement" repeat="20 6" width="0.2" height="10" depth="100" 
               material="roughness: 0.8; metalness: 0.1" shadow="cast: true; receive: true"></a-box>
        
        <!-- Back border -->
        <a-box id="fence-back" position="0 1 -50" src="#pavement" repeat="20 6" width="100" height="10" depth="0.2" 
               material="roughness: 0.8; metalness: 0.1" shadow="cast: true; receive: true"></a-box>
        
        <!-- Front fence with gate opening - Enclosed Rectangle -->
        <a-box id="fence-front-left" position="-25 1 50" src="#pavement" repeat="10 6" width="33" height="10" depth="0.2" 
               material="roughness: 0.8; metalness: 0.1" shadow="cast: true; receive: true"></a-box>
        <a-box id="fence-front-right" position="25 1 50" src="#pavement" repeat="10 6" width="33" height="10" depth="0.2" 
               material="roughness: 0.8; metalness: 0.1" shadow="cast: true; receive: true"></a-box>

        <!-- Interactive Camera Behind Gate - Full Property View -->
        <a-entity id="camera-container" position="0 5 85" rotation="0 0 0">
            <a-camera id="main-camera" active="true" fov="80" near="0.1" far="1000" cursor="rayOrigin: mouse">
                <a-cursor id="camera-cursor"></a-cursor>
            </a-camera>
        </a-entity>

        <!--Text Display - Name Tag in Sky Left (Raised Higher)-->
        <a-text id="student-name-tag" value="AKOTEY DOROTHY\nFCM.41.020.017.24\nIS2" 
                position="-15 20 -15" 
                color="white" 
                width="15" 
                align="center"
                font="kelsonsans"
                side="double"></a-text>

        <!--Villa - Modern House with Glass Windows -->
        <a-entity id="villa-house" gltf-model="#mm" position="10 3 15" scale="10 10 10" 
                 material="color: #F5F5F5; metalness: 0.1; roughness: 0.8; envMap: #sky; envMapIntensity: 0.8"
                 shadow="cast: true; receive: true"></a-entity>
        
        <!-- Interior Room Labels -->
        <a-text id="master-bedroom-label" value="Master Bedroom" position="5 8 20" color="white" width="8" align="center" font="kelsonsans" side="double"></a-text>
        <a-text id="living-area-label" value="Living Area" position="15 8 20" color="white" width="8" align="center" font="kelsonsans" side="double"></a-text>
        <a-text id="kitchen-label" value="Kitchen" position="10 8 30" color="white" width="8" align="center" font="kelsonsans" side="double"></a-text>

        <!--Balcony with Realistic Swimming Pool -->
        <a-entity id="balcony-structure" gltf-model="#balcony" position="-40 3.5 15" scale="1 1 1" rotation="0 0 0"></a-entity>
        
        <!-- Balcony Pool Water Surface -->
        <a-plane id="balcony-pool-water" position="-40 5.5 15" rotation="-90 0 0" width="6" height="4" 
                 material="color: #00f2ff; opacity: 0.8; transparent: true; metalness: 1; roughness: 0; emissive: #00ffff; emissiveIntensity: 0.5"
                 animation="property: position; to: -40 5.52 15; dur: 3000; dir: alternate; loop: true"
                 shadow="cast: true; receive: true"
                 onclick="teleportToBalcony()"></a-plane>
        
        <!-- Pool Floor with Tile Texture -->
        <a-box id="balcony-pool-floor" position="-40 5.4 15" rotation="-90 0 0" width="6.2" height="4.2" depth="0.1" 
                 material="src:#tile; repeat: 4 3; roughness: 0.7" 
                 shadow="cast: true; receive: true"></a-box>
        
        <!-- Glass Railing Around Pool -->
        <a-box id="railing-left" position="-43 5.5 15" width="0.1" height="1" depth="4.2" 
                 material="color: #ffffff; opacity: 0.2; transparent: true"></a-box>
        <a-box id="railing-right" position="-37 5.5 15" width="0.1" height="1" depth="4.2" 
                 material="color: #ffffff; opacity: 0.2; transparent: true"></a-box>
        <a-box id="railing-back" position="-40 5.5 13" width="6" height="1" depth="0.1" 
                 material="color: #ffffff; opacity: 0.2; transparent: true"></a-box>
        <a-box id="railing-front" position="-40 5.5 17" width="6" height="1" depth="0.1" 
                 material="color: #ffffff; opacity: 0.2; transparent: true"></a-box>
        
        <!-- Balcony Pool Night Light -->
        <a-light id="balcony-pool-light" type="point" color="#00f2ff" intensity="2" position="-40 6 15" distance="10"></a-light>

        <!-- Lamborghini Countach LPI 800-4 -->
        <a-entity id="lamborghini-car" gltf-model="#lamborghini" position="25 5 35" scale="2 2 2" rotation="0 0 0" 
                 material="color: #FF6600; metalness: 0.95; roughness: 0.05; envMap: #sky; envMapIntensity: 2"
                 shadow="cast: true; receive: true"></a-entity>

        <!-- Tree Clusters Along Side Walls - Private Estate -->
        <!-- Left Wall Cluster 1 -->
        <a-entity id="tree-left-1" gltf-model="#tree" position="-45 3 10" scale="18 16 16" rotation="0 30 0" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-left-2" gltf-model="#tree" position="-48 3 8" scale="16 14 14" rotation="0 45 0" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-left-3" gltf-model="#tree" position="-42 3 12" scale="17 15 15" rotation="0 15 0" shadow="cast: true; receive: true"></a-entity>
        
        <!-- Left Wall Cluster 2 -->
        <a-entity id="tree-left-4" gltf-model="#tree" position="-45 3 35" scale="19 17 17" rotation="0 60 0" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-left-5" gltf-model="#tree" position="-48 3 33" scale="17 15 15" rotation="0 30 0" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-left-6" gltf-model="#tree" position="-42 3 37" scale="18 16 16" rotation="0 75 0" shadow="cast: true; receive: true"></a-entity>
        
        <!-- Right Wall Cluster 1 -->
        <a-entity id="tree-right-1" gltf-model="#tree" position="45 3 10" scale="18 16 16" rotation="0 -30 0" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-right-2" gltf-model="#tree" position="48 3 8" scale="16 14 14" rotation="0 -45 0" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-right-3" gltf-model="#tree" position="42 3 12" scale="17 15 15" rotation="0 -15 0" shadow="cast: true; receive: true"></a-entity>
        
        <!-- Right Wall Cluster 2 -->
        <a-entity id="tree-right-4" gltf-model="#tree" position="45 3 35" scale="19 17 17" rotation="0 -60 0" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-right-5" gltf-model="#tree" position="48 3 33" scale="17 15 15" rotation="0 -30 0" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-right-6" gltf-model="#tree" position="42 3 37" scale="18 16 16" rotation="0 -75 0" shadow="cast: true; receive: true"></a-entity>
        
        <!-- Decorative Bushes Near Villa -->
        <a-sphere id="bush-1" position="5 3.2 8" radius="0.8" color="#228B22" material="roughness: 0.9" shadow="cast: true; receive: true"></a-sphere>
        <a-sphere id="bush-2" position="15 3.2 12" radius="0.6" color="#2E7D32" material="roughness: 0.9" shadow="cast: true; receive: true"></a-sphere>
        <a-sphere id="bush-3" position="8 3.2 15" radius="0.7" color="#388E3C" material="roughness: 0.9" shadow="cast: true; receive: true"></a-sphere>
        <a-sphere id="bush-4" position="12 3.2 5" radius="0.5" color="#43A047" material="roughness: 0.9" shadow="cast: true; receive: true"></a-sphere>
        <a-sphere id="bush-5" position="18 3.2 8" radius="0.6" color="#4CAF50" material="roughness: 0.9" shadow="cast: true; receive: true"></a-sphere>
        
        <!-- Flower Details -->
        <a-cylinder id="flower-1" position="6 3.3 10" radius="0.1" height="0.3" color="#FF69B4" material="roughness: 0.3"></a-cylinder>
        <a-cylinder id="flower-2" position="14 3.3 13" radius="0.1" height="0.3" color="#FFB6C1" material="roughness: 0.3"></a-cylinder>
        <a-cylinder id="flower-3" position="9 3.3 14" radius="0.1" height="0.3" color="#FFC0CB" material="roughness: 0.3"></a-cylinder>
        <a-cylinder id="flower-4" position="16 3.3 6" radius="0.1" height="0.3" color="#FF1493" material="roughness: 0.3"></a-cylinder>
        
        <!-- Existing Property Trees -->
        <!--Behind House - Left Corner-->
        <a-entity id="tree-back-left-1" gltf-model="#tree" position="-25 2.7 -20" scale="18 16 16" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-back-left-2" gltf-model="#tree" position="-35 3 -20" scale="20 18 18" shadow="cast: true; receive: true"></a-entity>
        
        <!--Behind House - Right Corner-->
        <a-entity id="tree-back-right-1" gltf-model="#tree" position="40 2.7 -20" scale="18 16 16" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-back-right-2" gltf-model="#tree" position="48 3 -20" scale="20 18 18" shadow="cast: true; receive: true"></a-entity>
        
        <!--In Front of House - Left Corner-->
        <a-entity id="tree-front-left-1" gltf-model="#tree" position="-45 2.7 25" scale="18 16 16" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-front-left-2" gltf-model="#tree" position="-48 3 25" scale="20 18 18" shadow="cast: true; receive: true"></a-entity>
        
        <!--In Front of House - Right Corner-->
        <a-entity id="tree-front-right-1" gltf-model="#tree" position="40 2.7 25" scale="18 16 16" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-front-right-2" gltf-model="#tree" position="48 3 25" scale="20 18 18" shadow="cast: true; receive: true"></a-entity>
        
        <!--Additional Trees Around Property -->
        <a-entity id="tree-extra-1" gltf-model="#tree" position="-20 2.7 10" scale="15 13 13" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-extra-2" gltf-model="#tree" position="30 2.7 8" scale="16 14 14" shadow="cast: true; receive: true"></a-entity>
        <a-entity id="tree-extra-3" gltf-model="#tree" position="0 2.7 -30" scale="17 15 15" shadow="cast: true; receive: true"></a-entity>

        <!--Swimming Model with Chairs - Bigger Scale (Behind House)-->
        <a-entity id="pool-model-back" gltf-model="#good" position="-15 4 -15" scale="1.5 1.5 1.5"></a-entity>
        
        <!--Perfect Pool Water - Bigger Inside Good Pool Basin (Behind House)-->
        <a-entity id="pool-water-back" position="-14 4 -14">
            <a-ocean id="ocean-back-pool" width="4.5" height="9" opacity="0.8" speed="0.15" density="50" color="#4A90E2"></a-ocean>
        </a-entity>

        <!-- Strong Sunlight Directional Light -->
        <a-entity id="sunlight" light="type:directional; color:#fffceb; intensity:1.5; position:-15 8 5" 
                 shadow="cast: true; receive: true; shadowCamera: {left: -80; right: 80; top: 80; bottom: -80}; shadowMapSize: 4096"></a-entity>
        
        <!-- Ambient Light for Depth -->
        <a-entity id="ambient-light" light="type:ambient; color:#87CEEB; intensity:0.6"></a-entity>

    </a-scene>

</body>

</html>
